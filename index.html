<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Akses VIP Portal</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 18px;
      min-height: 100vh;
    }

    .badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
      text-transform: uppercase;
      color: #38bdf8;
      font-weight: 600;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-align: center;
    }

    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 26px;
      text-align: center;
    }

    .btn-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Style Dasar Tombol */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      border-radius: 14px;
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      border: none;
    }

    .btn:active {
      transform: scale(0.97);
      filter: brightness(0.85);
    }

    /* ================= PILIHAN WARNA TOMBOL ================= */
    
    /* Gradasi Pink - Merah */
    .btn-pink {
      background: linear-gradient(135deg, #ec4899, #e11d48);
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.35);
    }

    /* Gradasi Ungu VIP */
    .btn-purple {
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
    }

    /* Gradasi Neon Cyan / Biru Laut */
    .btn-cyan {
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
    }

    /* Gradasi Emas / Gold */
    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
    }

    /* Warna Hijau Solid (Online / Success) */
    .btn-green {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
    }

    /* Footer Sederhana */
    .footer {
      margin-top: auto;
      padding-top: 30px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="badge">OFFICIAL PORTAL</div>
  <h1>✦ PILIHAN AKSES VIP ✦</h1>
  <p class="subtitle">Silakan pilih menu layanan di bawah ini:</p>

  <div class="btn-container">
    <!-- Tombol 1: Gradasi Pink -->
    <a href="https://t.me/galerinakalwebsite" class="btn btn-pink">
      🔥 GABUNG CHANNEL VIP
    </a>

    <!-- Tombol 2: Gradasi Ungu -->
    <a href="https://t.me/telegalerinakal_bot" class="btn btn-purple">
      💎 BELI KODE AKSES BOT
    </a>

    <!-- Tombol 3: Gradasi Cyan -->
    <a href="https://t.me/amiragalerinakal" class="btn btn-cyan">
      💬 CHAT ADMIN 1 (ONLINE)
    </a>

    <!-- Tombol 4: Gradasi Emas / Gold -->
    <a href="https://t.me/officialgalerinakal" class="btn btn-gold">
      ⚡ CHAT ADMIN 2 (ONLINE)
    </a>

    <!-- Tombol 5: Hijau Solid -->
    <a href="https://t.me/galerinakalwebsite" class="btn btn-green">
      🟢 TESTIMONI & BUKTI
    </a>
  </div>

  <div class="footer">
    © 2026 Portal Layanan Resmi. All rights reserved.
  </div>

  <script>
    // Memastikan SDK Telegram aktif dan jendela popup dibuka penuh
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
