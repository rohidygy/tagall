<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Web</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px;
      min-height: 100vh;
    }
    .badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
      color: #38bdf8;
      font-weight: 600;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; text-align: center; }
    p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 24px; text-align: center; }
    .btn-container { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 13px; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 16px; font-size: 15px; font-weight: 700;
      color: #ffffff; text-decoration: none; border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35); transition: transform 0.15s ease;
    }
    .btn:active { transform: scale(0.97); filter: brightness(0.85); }
    .color-0 { background: linear-gradient(135deg, #ec4899, #e11d48); }
    .color-1 { background: linear-gradient(135deg, #a855f7, #6b21a8); }
    .color-2 { background: linear-gradient(135deg, #06b6d4, #0284c7); }
    .color-3 { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .color-4 { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .footer { margin-top: auto; padding-top: 30px; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>

  <div class="badge" id="app-badge">OFFICIAL PORTAL</div>
  <h1 id="app-title">✦ PILIHAN AKSES VIP ✦</h1>
  <p class="subtitle" id="app-subtitle">Silakan pilih menu layanan di bawah ini:</p>

  <div class="btn-container" id="menu-list"></div>

  <div class="footer">© 2026 Portal Layanan Resmi.</div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const rawData = window.location.hash.substring(1);
    const container = document.getElementById("menu-list");

    if (rawData) {
      try {
        const payload = JSON.parse(decodeURIComponent(rawData));
        
        // Cek apakah ada data judul kustom
        if (payload.title) document.getElementById("app-title").innerText = payload.title;
        if (payload.subtitle) document.getElementById("app-subtitle").innerText = payload.subtitle;
        if (payload.badge) document.getElementById("app-badge").innerText = payload.badge;

        // Render tombol
        const items = payload.items || payload;
        items.forEach((item, index) => {
          const a = document.createElement("a");
          a.href = item.url;
          a.innerText = item.text;
          a.className = `btn color-${index % 5}`;
          container.appendChild(a);
        });
      } catch (err) {
        container.innerHTML = "<p style='color:#ef4444; font-size:13px;'>Gagal memuat konfigurasi.</p>";
      }
    }
  </script>
</body>
</html>
